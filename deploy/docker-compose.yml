version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_pwd}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay-api:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: relay-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay_pwd}@postgres:5432/${POSTGRES_DB:-relay}
      API_KEY: ${API_KEY:-change_me}
      HMAC_SECRET: ${HMAC_SECRET:-change_me_too}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${RELAY_PORT:-8080}:8080"

volumes:
  pgdata:
