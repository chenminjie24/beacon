[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-relay"
version = "0.1.0"
description = "JoinQuant signal relay core for QMT execution"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]
db = [
  "psycopg[binary]>=3.1,<4.0",
  "alembic>=1.14,<2.0",
  "sqlalchemy>=2.0,<3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
